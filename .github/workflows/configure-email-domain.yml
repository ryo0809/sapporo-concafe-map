name: Configure email sending domain
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, onboard]
        required: true
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EMAIL_DOMAIN_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/configure-email-domain.mjs
